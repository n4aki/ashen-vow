<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>アヌビスのモーション</title><style>
body{margin:0;padding:26px;background:#10191c;color:#e6dcc4;font:14px system-ui}h1{font-size:22px}h2{font-size:16px;color:#d6be88;margin-top:24px}p{color:#a9b3b1}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px}article{background:#192329;border:1px solid #596254;text-align:center;padding:10px}h3{font-size:13px}canvas{width:100%;max-width:280px;image-rendering:pixelated}button,select{background:#293840;color:#e6dcc4;border:1px solid #858570;padding:8px 14px;margin-right:10px;cursor:pointer}a{color:#d6be88}header{position:sticky;top:0;background:#10191ced;padding:8px 0;z-index:1}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><h1>冥府の守護者 アヌビス</h1><p>第2ステージのボス。待機・歩行・杖の叩きつけ・倒れる動き。</p><header><button id="pause">一時停止</button><button id="step">コマ送り</button><button id="flip">左向きにする</button><label>速度 <select id="speed"><option value="1">1倍</option><option value="0.5">0.5倍</option><option value="0.25">0.25倍</option></select></label><a href="index.html">ゲームを開く</a></header>
<section><h2>砂に沈んだ王墓の守護者</h2><div class="grid" data-kind="anubis"></div></section>
<script src="skeleton-motion.js"></script><script src="enemy-motion.js"></script><script>
const panels=[];for(const grid of document.querySelectorAll('.grid')){const kind=grid.dataset.kind,engine=EnemyMotion.forType(kind);for(const [clip,label] of [['idle','待機'],['walk','移動'],['attack',kind==='mage'?'詠唱・発射':'振りかぶり・叩きつけ'],['death','倒れる']]){const article=document.createElement('article');article.innerHTML='<h3>'+label+'</h3><canvas width="280" height="250"></canvas>';grid.append(article);const c=article.querySelector('canvas'),anim=engine.create();engine.play(anim,clip);panels.push({c,ctx:c.getContext('2d'),engine,anim,kind});}}
let paused=false,side=1,last=0,manualFrame=0;document.getElementById('step').onclick=()=>{paused=true;manualFrame=(manualFrame+1)%4;document.getElementById('pause').textContent='再開';for(const p of panels)p.anim.elapsed=p.engine.clips[p.anim.name].times.slice(0,manualFrame).reduce((a,b)=>a+b,0)+.001;};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'再開':'一時停止';};document.getElementById('flip').onclick=()=>{side*=-1;document.getElementById('flip').textContent=side<0?'右向きにする':'左向きにする';};
function tick(now){const dt=Math.min((now-last)/1000||0,.05)*Number(document.getElementById('speed').value);last=now;for(const p of panels){const clip=p.engine.clips[p.anim.name];if(!paused){if(!clip.loop&&p.anim.elapsed>=clip.duration)p.engine.play(p.anim,p.anim.name,true);else p.engine.advance(p.anim,dt);}p.ctx.clearRect(0,0,280,250);p.ctx.strokeStyle='#576662';p.ctx.beginPath();p.ctx.moveTo(15,218);p.ctx.lineTo(265,218);p.ctx.stroke();const size=p.kind==='anubis'?232:p.kind==='knight'?176:216;p.engine.draw(p.ctx,p.engine.frame(p.anim),140,216,side,1,size);p.ctx.fillStyle='#aab6b0';p.ctx.font='11px monospace';p.ctx.fillText('FRAME '+(p.engine.frame(p.anim)%4+1)+' / 4',12,240);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
