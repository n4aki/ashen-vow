<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>骸骨のモーション確認</title>
<style>body{margin:0;background:#10191c;color:#e5dac0;font:15px system-ui;padding:32px}h1{font-size:22px;margin:0 0 8px}p{color:#a4b3b3;font-size:13px}main{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:16px;margin:24px 0}article{border:1px solid #5c6053;background:#192329;text-align:center;padding:15px}canvas{width:100%;image-rendering:pixelated}h2{font-size:14px}button,select{background:#293840;color:#e5dac0;border:1px solid #858570;padding:8px 15px;cursor:pointer;margin-right:12px}a{color:#d9c28a}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<h1>骸骨のスプライトアニメーション</h1><p>待機・歩行・斬撃・倒れる / 各4コマ。ゲームと同じ画像と再生処理で表示しています。</p>
<main><article><h2>待機 · IDLE</h2><canvas data-clip="idle" width="280" height="250"></canvas></article><article><h2>歩行 · WALK</h2><canvas data-clip="walk" width="280" height="250"></canvas></article><article><h2>斬撃 · ATTACK</h2><canvas data-clip="attack" width="280" height="250"></canvas></article><article><h2>倒れる · DEATH</h2><canvas data-clip="death" width="280" height="250"></canvas></article></main>
<button id="pause">一時停止</button><button id="flip">左向きにする</button><label>再生速度 <select id="speed"><option value="1">1倍</option><option value="0.5">0.5倍</option><option value="0.25">0.25倍</option></select></label> <a href="index.html">ゲームを開く</a>
<script src="skeleton-motion.js"></script><script>
const panels=[...document.querySelectorAll('canvas')].map(c=>{const anim=SkeletonMotion.create();SkeletonMotion.play(anim,c.dataset.clip);return {c,ctx:c.getContext('2d'),anim};});let paused=false,side=1,last=0;
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'再開':'一時停止';};document.getElementById('flip').onclick=()=>{side*=-1;document.getElementById('flip').textContent=side<0?'右向きにする':'左向きにする';};
function tick(now){const dt=Math.min((now-last)/1000||0,.05)*Number(document.getElementById('speed').value);last=now;for(const p of panels){if(!paused){const clip=SkeletonMotion.clips[p.anim.name];if(!clip.loop&&p.anim.elapsed>=clip.duration)SkeletonMotion.play(p.anim,p.anim.name,true);else SkeletonMotion.advance(p.anim,dt);}p.ctx.clearRect(0,0,280,250);p.ctx.strokeStyle='#576662';p.ctx.beginPath();p.ctx.moveTo(15,212);p.ctx.lineTo(265,212);p.ctx.stroke();SkeletonMotion.draw(p.ctx,SkeletonMotion.frame(p.anim),140,210,side,1,216);p.ctx.fillStyle='#a9b6b0';p.ctx.font='11px monospace';p.ctx.fillText('FRAME '+(SkeletonMotion.frame(p.anim)%4+1)+' / 4',14,238);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
